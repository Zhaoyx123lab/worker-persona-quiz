<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>打工人成分检测</title>
  <meta name="description" content="不是测你是谁，是测你怎么熬过这一天。30 题测出你的上班人格。" />
  <style>
    :root {
      --bg: #f4f4f5;
      --surface: #fafafa;
      --ink: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --accent: #c2410c;
      --accent-soft: #ffedd5;
      --accent-ink: #9a3412;
      --radius: 14px;
      --shadow: 0 1px 0 rgba(24, 24, 27, 0.04), 0 8px 24px rgba(24, 24, 27, 0.06);
      --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .shell {
      width: min(720px, calc(100% - 2rem));
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* —— Header —— */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 0 0.75rem;
      gap: 1rem;
    }
    .brand {
      font-weight: 700;
      letter-spacing: -0.02em;
      font-size: 1.05rem;
    }
    .brand span { color: var(--accent); }
    .top-meta {
      font-size: 0.8125rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* —— Progress —— */
    .progress-wrap {
      display: none;
      margin-bottom: 2rem;
    }
    .progress-wrap.on { display: block; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
      font-size: 0.8125rem;
      color: var(--muted);
    }
    .progress-meta strong {
      color: var(--ink);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .progress-track {
      height: 3px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* —— Screens —— */
    .screen { display: none; flex: 1; flex-direction: column; padding-bottom: 3rem; }
    .screen.on { display: flex; }

    .fade-in {
      animation: fade 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .fade-in { animation: none; }
      .progress-fill { transition: none; }
      .opt { transition: none !important; }
    }

    /* —— Intro —— */
    .intro-kicker {
      margin-top: 12vh;
      font-size: 0.8125rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: var(--mono);
    }
    .intro h1 {
      margin: 0.75rem 0 1rem;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.12;
      letter-spacing: -0.03em;
      font-weight: 800;
      max-width: 14em;
    }
    .intro h1 em {
      font-style: normal;
      color: var(--accent);
    }
    .intro-lead {
      margin: 0 0 2rem;
      color: var(--muted);
      font-size: 1.0625rem;
      max-width: 32em;
    }
    .intro-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: var(--ink);
      color: #fafafa;
      border-radius: 999px;
      padding: 0.85rem 1.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn-primary:hover { background: #27272a; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-ghost {
      padding: 0.85rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
      border-radius: 999px;
    }
    .btn-ghost:hover { color: var(--ink); }

    .intro-facts {
      margin-top: 3.5rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .fact {
      background: var(--surface);
      padding: 1rem 1.1rem;
    }
    .fact b {
      display: block;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .fact span {
      font-size: 0.75rem;
      color: var(--muted);
    }
    @media (max-width: 540px) {
      .intro-facts { grid-template-columns: 1fr; }
      .intro-kicker { margin-top: 6vh; }
    }

    /* —— Question —— */
    .q-title {
      margin: 0.25rem 0 1.75rem;
      font-size: clamp(1.35rem, 3.5vw, 1.75rem);
      letter-spacing: -0.02em;
      line-height: 1.3;
      font-weight: 700;
    }
    .opts {
      display: grid;
      gap: 0.75rem;
    }
    .opt {
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.05rem 1.15rem;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.85rem;
      align-items: start;
      box-shadow: var(--shadow);
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }
    .opt:hover {
      border-color: #a1a1aa;
      transform: translateY(-1px);
    }
    .opt:active { transform: scale(0.995); }
    .opt.picked {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .opt-key {
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      display: grid;
      place-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: var(--mono);
      color: var(--muted);
      flex-shrink: 0;
    }
    .opt.picked .opt-key {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .opt-text {
      font-size: 0.98rem;
      padding-top: 0.15rem;
    }
    .q-nav {
      margin-top: 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .q-hint { font-size: 0.8125rem; color: var(--muted); }

    /* —— Result —— */
    .result-code {
      font-family: var(--mono);
      font-size: clamp(2.75rem, 10vw, 4.25rem);
      letter-spacing: 0.08em;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      text-align: center;
    }
    .result-name { text-align: center; }
    .result-title { text-align: center; }
    .result-quote { text-align: left; }
    .char-stage {
      margin: 5vh 0 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }
    .char-frame {
      width: min(260px, 72vw);
      aspect-ratio: 3 / 4;
      border-radius: 18px;
      background: linear-gradient(180deg, #fafafa 0%, #f4f4f5 100%);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .char-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .result-name {
      margin: 0.35rem 0 0.25rem;
      font-size: clamp(1.75rem, 4vw, 2.35rem);
      letter-spacing: -0.03em;
      font-weight: 800;
    }
    .result-title {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }
    .result-quote {
      margin: 1.5rem 0 2rem;
      padding: 1rem 1.15rem;
      border-left: 3px solid var(--accent);
      background: var(--surface);
      border-radius: 0 var(--radius) var(--radius) 0;
      font-size: 1.05rem;
      color: var(--accent-ink);
    }
    .result-body {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.35rem 1.4rem;
      box-shadow: var(--shadow);
    }
    .result-body h3 {
      margin: 0 0 0.5rem;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: var(--mono);
      font-weight: 600;
    }
    .result-body p {
      margin: 0 0 1.25rem;
      font-size: 0.98rem;
    }
    .result-body p:last-child { margin-bottom: 0; }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0 0 1.25rem;
    }
    .tag {
      font-size: 0.8125rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-ink);
      font-weight: 600;
    }
    .scores {
      margin-top: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.15rem 1.25rem;
    }
    .scores h3 { margin: 0 0 0.85rem; }
    .score-row {
      display: grid;
      grid-template-columns: 5.5rem 1fr 2rem;
      gap: 0.65rem;
      align-items: center;
      margin-bottom: 0.45rem;
      font-size: 0.8125rem;
    }
    .score-row:last-child { margin-bottom: 0; }
    .score-row .lab { color: var(--muted); }
    .score-row .lab b { color: var(--ink); font-weight: 600; margin-right: 0.25rem; }
    .bar {
      height: 6px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar i {
      display: block;
      height: 100%;
      background: #a1a1aa;
      border-radius: 999px;
    }
    .score-row.top .bar i { background: var(--accent); }
    .score-row .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.75rem;
    }
    .result-actions {
      margin-top: 1.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .share-note {
      margin-top: 1rem;
      font-size: 0.8125rem;
      color: var(--muted);
    }

    footer.page-foot {
      margin-top: auto;
      padding: 1.5rem 0 2rem;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">打工人<span>成分检测</span></div>
      <div class="top-meta" id="topMeta">打工人成分检测</div>
    </header>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-meta">
        <span>进度</span>
        <strong id="progressLabel">1 / 30</strong>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- Intro -->
    <section class="screen on" id="screenIntro">
      <div class="intro fade-in">
        <p class="intro-kicker">Workplace Type Indicator</p>
        <h1>不是测你是谁，<br />是测你怎么<em>熬过这一天</em>。</h1>
        <p class="intro-lead">30 道情景题，12 种上班成分。凭直觉选，别想太久——想太久的都是在演。</p>
        <div class="intro-actions">
          <button class="btn-primary" id="btnStart" type="button">开始测试</button>
        </div>
        <div class="intro-facts">
          <div class="fact"><b>30</b><span>道情景题</span></div>
          <div class="fact"><b>12</b><span>种上班人格</span></div>
          <div class="fact"><b>≈3</b><span>分钟完成</span></div>
        </div>
      </div>
    </section>

    <!-- Quiz -->
    <section class="screen" id="screenQuiz">
      <div class="fade-in" id="quizInner">
        <p class="q-title" id="qTitle">—</p>
        <div class="opts" id="qOpts"></div>
        <div class="q-nav">
          <button class="btn-ghost" id="btnPrev" type="button">上一题</button>
          <span class="q-hint">点选后自动进入下一题</span>
        </div>
      </div>
    </section>

    <!-- Result -->
    <section class="screen" id="screenResult">
      <div class="fade-in">
        <div class="char-stage">
          <div class="char-frame" id="rChar" aria-hidden="true"></div>
          <div class="char-badge" id="rCode">MG</div>
        </div>
        <h2 class="result-name" id="rName">摸鱼王</h2>
        <p class="result-title" id="rTitle">带薪养生艺术家</p>
        <blockquote class="result-quote" id="rQuote">「活是干不完的，但鱼是可以摸的。」</blockquote>
        <div class="result-body">
          <h3>画像</h3>
          <p id="rProfile"></p>
          <h3>标签</h3>
          <div class="tag-row" id="rTags"></div>
          <h3>职场必杀</h3>
          <p id="rSkill"></p>
          <h3>危险信号</h3>
          <p id="rRisk"></p>
          <h3>一句话总结</h3>
          <p id="rSummary"></p>
        </div>
        <div class="result-actions">
          <button class="btn-primary" id="btnShare" type="button">分享结果</button>
          <button class="btn-ghost" id="btnAgain" type="button">再测一次</button>
        </div>
        <p class="share-note">凭直觉作答。并列时按规则决出唯一人格。</p>
      </div>
    </section>

    <footer class="page-foot">打工人成分检测 · 娱乐向测试，不构成任何职业或心理诊断。</footer>
  </div>

  <script>
    const TYPES = {

        tags: ["伪装在岗", "Alt+Tab", "日报美化"],

      },
      DL: {

    function computeResult() {
      const score = Object.fromEntries(TYPE_ORDER.map((t) => [t, 0]));
      const emotion = Object.fromEntries(TYPE_ORDER.map((t) => [t, 0]));
      const first = Object.fromEntries(TYPE_ORDER.map((t) => [t, 999]));

      state.answers.forEach((type, qi) => {
        if (!type) return;
        score[type] += 1;
        if (EMOTION_Q.has(qi + 1)) emotion[type] += 1;
        if (first[type] === 999) first[type] = qi;
      });

      const max = Math.max(...Object.values(score));
      let candidates = TYPE_ORDER.filter((t) => score[t] === max);

      if (candidates.length > 1) {
        const emMax = Math.max(...candidates.map((t) => emotion[t]));
        candidates = candidates.filter((t) => emotion[t] === emMax);
      }
      if (candidates.length > 1) {
        const fiMin = Math.min(...candidates.map((t) => first[t]));
        candidates = candidates.filter((t) => first[t] === fiMin);
      }
      if (candidates.length > 1) {
        candidates = [candidates.sort((a, b) => TYPE_ORDER.indexOf(a) - TYPE_ORDER.indexOf(b))[0]];
      }
      return { winner: candidates[0], score };
    }

    function showResult() {
      const { winner } = computeResult();
      const p = TYPES[winner];
      $("rCode").textContent = winner;
      $("rChar").innerHTML = "";
      const img = document.createElement("img");
      img.src = "assets/characters-web/" + winner + ".png";
      img.alt = TYPES[winner].name;
      img.width = 480;
      img.height = 640;
      $("rChar").appendChild(img);
      $("rName").textContent = p.name;
      $("rTitle").textContent = p.title;
      $("rQuote").textContent = p.quote;
      $("rProfile").textContent = p.profile;
      $("rSkill").textContent = p.skill;
      $("rRisk").textContent = p.risk;
      $("rSummary").textContent = p.summary;
      const tags = $("rTags");
      tags.innerHTML = "";
      p.tags.forEach((t) => {
        const s = document.createElement("span");
        s.className = "tag";
        s.textContent = t;
        tags.appendChild(s);
      });
      show("result");
    }

    $("btnStart").addEventListener("click", () => {
      state.idx = 0;
      state.answers.fill(null);
      renderQuestion();
      show("quiz");
    });

    $("btnPrev").addEventListener("click", () => {
      if (state.idx > 0) {
        state.idx -= 1;
        renderQuestion();
      }
    });

    $("btnAgain").addEventListener("click", () => {
      state.idx = 0;
      state.answers.fill(null);
      show("intro");
    });

    function shareText() {
      const code = $("rCode").textContent;
      const p = TYPES[code];
      return `我是打工人成分检测的【${code}·${p.name}】——${p.title}\n${p.quote}\n${p.summary}\n来测测你的上班成分？`;
    }

    $("btnShare").addEventListener("click", async () => {
      const btn = $("btnShare");
      const text = shareText();
      const payload = { title: "打工人成分检测", text, url: location.href };
      try {
        if (navigator.share) {
          await navigator.share(payload);
          return;
        }
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
      try {
        await navigator.clipboard.writeText(`${text}\n${location.href}`);
        btn.textContent = "已复制，去粘贴";
        setTimeout(() => { btn.textContent = "分享结果"; }, 1800);
      } catch {
        btn.textContent = "复制失败";
        setTimeout(() => { btn.textContent = "分享结果"; }, 1800);
      }
    });
  </script>
